services:
  reverse-proxy:
    build:
      context: .
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3